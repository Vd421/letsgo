# CI: runs our checks on GitHub's computers on every push to main and every Pull Request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Download the repo's code onto the runner.
      - uses: actions/checkout@v7

      # Install Node 24 (same as local) and cache downloaded npm packages.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Install exact versions from package-lock.json.
      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
